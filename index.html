<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reloj de Respawns</title>
<style>
  :root{
    --bg:#f3ede2;
    --surface:#fffdf8;
    --surface-2:#ece3d2;
    --ink:#241d14;
    --muted:#7a6f5c;
    --line:#ddd0b8;
    --accent:#b5471b;
    --accent-ink:#fff8ef;
    --up:#2f6f5e;
    --up-bg:#e3ede9;
    --wait:#8a6d1f;
    --wait-bg:#f2e9d3;
    --danger:#a3321f;
    --shadow: 0 1px 2px rgba(36,29,20,.06), 0 8px 24px -12px rgba(36,29,20,.25);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#171310;
      --surface:#211b15;
      --surface-2:#2a231b;
      --ink:#f1e9da;
      --muted:#a89a80;
      --line:#3a3126;
      --accent:#e07a45;
      --accent-ink:#1c1108;
      --up:#7bc9ac;
      --up-bg:#1c2b25;
      --wait:#e0bd5f;
      --wait-bg:#2c2513;
      --danger:#e2694f;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

  *{ box-sizing:border-box; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    padding-inline:16px;
    padding-block:28px 60px;
    max-width:920px;
    margin:0 auto;
  }
  h1,h2{ font-family:'Cinzel','Georgia',serif; text-wrap:balance; margin:0; }
  .num{ font-family:'JetBrains Mono',ui-monospace,monospace; font-variant-numeric: tabular-nums; }

  header.top{
    display:flex; justify-content:space-between; align-items:flex-end; gap:16px;
    flex-wrap:wrap; margin-bottom:28px;
  }
  header.top h1{ font-size:1.7rem; color:var(--accent); letter-spacing:.02em; }
  header.top p{ margin:.3rem 0 0; color:var(--muted); font-size:.85rem; }

  .nick-box{
    display:flex; align-items:center; gap:8px; font-size:.8rem; color:var(--muted);
  }
  .nick-box input{
    font:inherit; font-weight:600; color:var(--ink); background:var(--surface-2);
    border:1px solid var(--line); border-radius:8px; padding:6px 10px; width:110px;
  }

  section{ margin-bottom:32px; }
  section > h2{ font-size:.75rem; text-transform:uppercase; letter-spacing:.12em;
    color:var(--muted); margin-bottom:12px; }

  .next-grid{
    display:flex; flex-direction:column; gap:10px;
  }
  .next-card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:16px; box-shadow:var(--shadow); position:relative; overflow:hidden;
    transition:opacity .2s, transform .2s, border-color .2s;
  }
  .next-card.is-up{ border-color:var(--up); }
  .next-card.rank-1{ padding:20px; }
  .next-card.rank-1 .name{ font-size:1.3rem; }
  .next-card.rank-1 .countdown{ font-size:1.8rem; }
  .next-card.rank-2{ opacity:.92; }
  .next-card.rank-3{ opacity:.84; transform:scale(.98); }
  .next-card.rank-4{ opacity:.76; transform:scale(.96); }
  .next-card.rank-5{ opacity:.68; transform:scale(.94); }
  .next-card .undo-death-card{
    position:absolute; top:10px; right:10px;
  }
  .next-card .card-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding-right:34px; margin-bottom:10px;
  }
  .next-card .name{ font-weight:700; font-size:1.05rem; }
  .next-card .status{
    display:inline-block; font-size:.7rem; font-weight:700; text-transform:uppercase;
    letter-spacing:.06em; padding:3px 9px; border-radius:999px; flex-shrink:0;
  }
  .status.up{ background:var(--up-bg); color:var(--up); }
  .status.wait{ background:var(--wait-bg); color:var(--wait); }
  .next-card .card-row{
    display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .next-card .countdown{ font-size:1.4rem; font-weight:700; text-align:right; }
  .empty-hint{ color:var(--muted); font-size:.85rem; font-style:italic; }
  .franja{ font-size:.78rem; }
  .franja-label{
    display:block; text-transform:uppercase; font-size:.65rem; letter-spacing:.06em;
    color:var(--muted); margin-bottom:2px;
  }
  .franja-time{ display:block; font-weight:600; color:var(--ink); }
  .countdown-inline{ margin-left:6px; }

  .boss-columns{ display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start; }
  @media (max-width:640px){ .boss-columns{ grid-template-columns:1fr; } }
  .boss-col{ container-type:inline-size; }
  .boss-col h3{ font-size:.7rem; text-transform:uppercase; letter-spacing:.1em;
    color:var(--muted); margin:0 0 10px; }
  .boss-list{ display:flex; flex-direction:column; gap:10px; }
  .boss-row{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:14px 44px 14px 16px; box-shadow:var(--shadow); position:relative;
    display:grid; grid-template-columns:1fr auto; gap:10px 16px; align-items:center;
    transition:border-color .2s;
  }
  .boss-row.is-up{ border-color:var(--up); }
  .boss-row.is-up .died-now{ background:var(--up); color:var(--accent-ink); }
  .boss-row .del-corner{
    position:absolute; top:10px; right:10px;
  }
  .boss-row .main{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  .boss-row .name-line{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .boss-row .name-line input.bname{
    font:inherit; font-weight:700; font-size:1rem; color:var(--ink); background:transparent;
    border:1px solid transparent; border-radius:6px; padding:2px 6px; min-width:80px; max-width:220px;
  }
  .boss-row .name-line input.bname:hover, .boss-row .name-line input.bname:focus{
    border-color:var(--line); background:var(--surface-2);
  }
  .boss-row .meta{ color:var(--muted); font-size:.78rem; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .boss-row .meta input.hrs{
    font:inherit; font-family:'JetBrains Mono',monospace; width:32px; text-align:center;
    border:1px solid var(--line); border-radius:5px; padding:1px 3px; background:var(--surface-2); color:var(--ink);
  }
  .boss-row .window-line{ font-size:.85rem; }
  .boss-row input.notes{
    font:inherit; font-size:.8rem; font-style:italic; color:var(--muted); background:transparent;
    border:1px dashed transparent; border-radius:6px; padding:3px 6px; margin-top:2px; width:100%; max-width:420px;
  }
  .boss-row input.notes:hover, .boss-row input.notes:focus{
    border-color:var(--line); background:var(--surface-2); font-style:normal;
  }
  .next-card .obs-note{
    font-size:.72rem; color:var(--wait); background:var(--wait-bg); border-radius:8px;
    padding:5px 8px; margin-top:8px; font-style:italic;
  }
  .boss-row .window-line .status{
    display:inline-block; font-size:.65rem; font-weight:700; text-transform:uppercase;
    letter-spacing:.05em; padding:2px 8px; border-radius:999px; margin-right:6px;
  }
  .boss-row .actions{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  @container (max-width:480px){
    .boss-row{ grid-template-columns:1fr; }
    .boss-row .actions{ justify-content:flex-start; }
  }
  button, .btn{
    font:inherit; font-weight:600; font-size:.8rem; border:none; border-radius:8px;
    padding:8px 12px; cursor:pointer; background:var(--surface-2); color:var(--ink);
  }
  button.primary{ background:var(--accent); color:var(--accent-ink); }
  button.ghost{ background:transparent; border:1px solid var(--line); }
  button.icon{ padding:8px 10px; }
  button:disabled{ opacity:.5; cursor:default; }
  input[type="time"]{
    font:inherit; font-size:.78rem; border:1px solid var(--line); border-radius:8px;
    padding:6px 8px; background:var(--surface-2); color:var(--ink);
  }

  .add-form{
    display:flex; gap:8px; flex-wrap:wrap; align-items:center; background:var(--surface);
    border:1px dashed var(--line); border-radius:12px; padding:12px 14px;
  }
  .add-form input[type="text"]{
    font:inherit; border:1px solid var(--line); border-radius:8px; padding:8px 10px;
    background:var(--surface-2); color:var(--ink); flex:1; min-width:140px;
  }
  .add-form label{ font-size:.75rem; color:var(--muted); display:flex; align-items:center; gap:4px; }
  .add-form input[type="number"]{
    width:48px; font:inherit; font-family:'JetBrains Mono',monospace; text-align:center;
    border:1px solid var(--line); border-radius:6px; padding:5px; background:var(--surface); color:var(--ink);
  }

  .foot-note{ color:var(--muted); font-size:.75rem; text-align:center; margin-top:20px; }
  a{ color:var(--accent); }
  .config-box{
    background:var(--wait-bg); border:1px solid var(--line); border-radius:12px;
    padding:16px; margin-bottom:24px; font-size:.85rem;
  }
  .config-box input{
    font:inherit; width:100%; margin-top:8px; padding:8px 10px; border-radius:8px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
  }
</style>
</head>
<body>

<div id="configBox" class="config-box" hidden>
  <strong>Falta configurar la conexión.</strong> Pegá acá la URL de tu Google Apps Script (la que termina en <span class="num">/exec</span>):
  <input type="text" id="apiUrlInput" placeholder="https://script.google.com/macros/s/AKfycb.../exec">
  <button class="primary" id="saveApiUrl" style="margin-top:8px;">Guardar</button>
</div>

<header class="top">
  <div>
    <h1>Reloj de Respawns</h1>
    <p>Anotá cuándo cae un boss y calculamos la ventana de reaparición (6–7 hs).</p>
  </div>
  <div class="nick-box">
    Tu nick <input id="nickInput" type="text" placeholder="ej: Renzo" maxlength="18">
  </div>
</header>

<section>
  <h2>Próximos 5</h2>
  <div class="next-grid" id="nextGrid"></div>
</section>

<section>
  <h2>Todos los bosses</h2>
  <div class="boss-columns" id="bossList">
    <div class="boss-col">
      <h3>Sin horario</h3>
      <div class="boss-list" id="bossListUnknown"></div>
    </div>
    <div class="boss-col">
      <h3>Con horario conocido</h3>
      <div class="boss-list" id="bossListKnown"></div>
    </div>
  </div>
</section>

<section>
  <h2>Agregar boss</h2>
  <div class="add-form">
    <input type="text" id="newName" placeholder="Nombre del boss">
    <label>Mín <input type="number" id="newMin" value="6" min="0" step="0.5"> hs</label>
    <label>Máx <input type="number" id="newMax" value="7" min="0" step="0.5"> hs</label>
    <button class="primary" id="addBtn">+ Agregar</button>
  </div>
</section>

<p class="foot-note" id="dbStatus">Conectando…</p>

<script>
(function(){
  "use strict";

  var NICK_KEY = "respawn-tracker-nick";
  var API_KEY = "respawn-tracker-api-url";
  var POLL_MS = 6000;

  var nickInput = document.getElementById("nickInput");
  var dbStatusEl = document.getElementById("dbStatus");
  var nextGrid = document.getElementById("nextGrid");
  var bossList = document.getElementById("bossList");
  var bossListUnknown = document.getElementById("bossListUnknown");
  var bossListKnown = document.getElementById("bossListKnown");
  var configBox = document.getElementById("configBox");
  var apiUrlInput = document.getElementById("apiUrlInput");

  var API_URL = "";
  try { API_URL = localStorage.getItem(API_KEY) || ""; } catch(e) {}

  if (!API_URL) {
    configBox.hidden = false;
  }
  document.getElementById("saveApiUrl").addEventListener("click", function(){
    var v = apiUrlInput.value.trim();
    if (!v) return;
    try { localStorage.setItem(API_KEY, v); } catch(e) {}
    location.reload();
  });

  try {
    var savedNick = localStorage.getItem(NICK_KEY);
    if (savedNick) nickInput.value = savedNick;
  } catch(e) {}
  nickInput.addEventListener("input", function(){
    try { localStorage.setItem(NICK_KEY, nickInput.value.trim()); } catch(e) {}
  });
  function getNick(){
    var v = (nickInput.value || "").trim();
    return v || "Anónimo";
  }

  var bosses = []; // {id, name, minHours, maxHours, lastDeathAt, lastBy, notes}
  var openTimeInputs = new Set(); // ids con el input de "Cargar hora" desplegado

  function fmtTime(d){
    return d.toLocaleString(undefined, {
      day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"
    });
  }
  function fmtTimeOnly(d){
    return d.toLocaleTimeString(undefined, { hour:"2-digit", minute:"2-digit" });
  }
  function fmtDuration(ms){
    var neg = ms < 0;
    ms = Math.abs(ms);
    var totalMin = Math.floor(ms/60000);
    var h = Math.floor(totalMin/60), m = totalMin % 60;
    return (neg?"-":"") + h + "h " + String(m).padStart(2,"0") + "m";
  }

  function windowFor(boss){
    if (!boss.lastDeathAt) return null;
    var death = new Date(boss.lastDeathAt);
    var start = new Date(death.getTime() + boss.minHours*3600000);
    var end = new Date(death.getTime() + boss.maxHours*3600000);
    return { start: start, end: end };
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  function windowHtmlFor(w, now){
    if (!w) return '<span class="empty-hint">Sin muerte registrada</span>';
    var isUp = now >= w.start;
    return '<span class="status ' + (isUp?"up":"wait") + '">' + (isUp?"Puede salir":"En espera") + '</span>' +
      '<span class="num countdown-inline">' + (isUp ? "hace " + fmtDuration(now-w.start) : fmtDuration(w.start-now) + " para abrir") + '</span>' +
      '<div class="franja">' +
        '<span class="franja-label">Franja de Respawn</span>' +
        '<span class="num franja-time">' + fmtTimeOnly(w.start) + '</span>' +
        '<span class="num franja-time">' + fmtTimeOnly(w.end) + '</span>' +
      '</div>';
  }

  // Reconstruye la lista completa (nombres, inputs, botones). Se llama SOLO
  // cuando cambian los datos, nunca en el tick de cada segundo, para no
  // pisar lo que el usuario esté tipeando en un input.
  function render(){
    var now = new Date();
    var withWindow = [];
    var withoutData = [];
    bosses.forEach(function(b){
      var w = windowFor(b);
      if (w) withWindow.push({ boss: b, w: w });
      else withoutData.push(b);
    });
    withWindow.sort(function(a,b){ return a.w.start - b.w.start; });

    // --- Próximos 3 ---
    nextGrid.innerHTML = "";
    if (withWindow.length === 0) {
      nextGrid.innerHTML = '<p class="empty-hint">Todavía nadie anotó una muerte. Cuando anotes una, va a aparecer acá.</p>';
    } else {
      withWindow.slice(0,5).forEach(function(item, i){
        var isUp = now >= item.w.start;
        var card = document.createElement("div");
        card.className = "next-card rank-" + (i+1) + (isUp ? " is-up" : "");
        card.dataset.id = item.boss.id;
        var countdown = isUp
          ? '<span class="num">' + fmtDuration(now - item.w.start) + '</span> en ventana'
          : '<span class="num">' + fmtDuration(item.w.start - now) + '</span>';
        card.innerHTML =
          '<button class="icon ghost undo-death-card" data-id="' + item.boss.id + '" title="Quitar de próximos (no borra el boss)">✕</button>' +
          '<div class="card-head">' +
            '<div class="name">' + escapeHtml(item.boss.name) + '</div>' +
            '<div class="status live-status ' + (isUp ? "up" : "wait") + '">' + (isUp ? "Puede salir" : "En espera") + '</div>' +
          '</div>' +
          '<div class="card-row">' +
            '<div class="window franja">' +
              '<span class="franja-label">Franja de Respawn</span>' +
              '<span class="num franja-time">' + fmtTimeOnly(item.w.start) + '</span>' +
              '<span class="num franja-time">' + fmtTimeOnly(item.w.end) + '</span>' +
            '</div>' +
            '<div class="countdown live-countdown">' + countdown + '</div>' +
          '</div>' +
          (item.boss.notes ? '<div class="obs-note">📝 ' + escapeHtml(item.boss.notes) + '</div>' : '');
        nextGrid.appendChild(card);
      });
    }

    // --- Lista completa ---
    var all = withWindow.concat(withoutData.map(function(b){ return { boss:b, w:null }; }));
    all.sort(function(a,b){
      if (a.w && b.w) return a.w.start - b.w.start;
      if (a.w) return -1;
      if (b.w) return 1;
      return a.boss.name.localeCompare(b.boss.name);
    });

    bossListUnknown.innerHTML = "";
    bossListKnown.innerHTML = "";
    all.forEach(function(item){
      var b = item.boss, w = item.w;
      var isUp = !!w && now >= w.start;
      var row = document.createElement("div");
      row.className = "boss-row" + (isUp ? " is-up" : "");

      var lastInfo = b.lastDeathAt
        ? "Murió: " + fmtTime(new Date(b.lastDeathAt)) + (b.lastBy ? " · anotó " + escapeHtml(b.lastBy) : "")
        : "";

      var loadTimeHtml = openTimeInputs.has(b.id)
        ? '<input type="time" class="deathpicker" data-id="' + b.id + '">' +
          '<button class="ghost setdeath-confirm" data-id="' + b.id + '">OK</button>' +
          '<button class="ghost setdeath-cancel" data-id="' + b.id + '">Cancelar</button>'
        : '<button class="ghost setdeath-toggle" data-id="' + b.id + '">Cargar hora</button>';

      row.innerHTML =
        '<button class="icon ghost del-corner" data-id="' + b.id + '" title="Eliminar boss de la lista">✕</button>' +
        '<div class="main">' +
          '<div class="name-line"><input class="bname" data-id="' + b.id + '" value="' + escapeHtml(b.name) + '"></div>' +
          '<div class="meta">' +
            'Respawn: <input class="hrs" data-field="minHours" data-id="' + b.id + '" type="number" step="0.5" min="0" value="' + b.minHours + '"> a ' +
            '<input class="hrs" data-field="maxHours" data-id="' + b.id + '" type="number" step="0.5" min="0" value="' + b.maxHours + '"> hs' +
            (lastInfo ? " · " + lastInfo : "") +
          '</div>' +
          '<div class="window-line" data-id="' + b.id + '">' + windowHtmlFor(w, now) + '</div>' +
          '<input class="notes" data-id="' + b.id + '" type="text" maxlength="140" placeholder="Observación (ej: enrabia en fase 2, requiere 3+)" value="' + escapeHtml(b.notes || "") + '">' +
        '</div>' +
        '<div class="actions">' +
          loadTimeHtml +
          '<button class="primary died-now" data-id="' + b.id + '">Murió ahora</button>' +
          (b.lastDeathAt ? '<button class="ghost undo-death" data-id="' + b.id + '" title="Quita el registro de muerte, no borra el boss">Quitar de próximos</button>' : '') +
        '</div>';

      (w ? bossListKnown : bossListUnknown).appendChild(row);
    });

    wireRowEvents();
  }

  // Corre cada segundo: solo actualiza los textos de countdown/ventana,
  // nunca reconstruye los inputs, así no se pierde lo que estás tipeando.
  function tick(){
    var now = new Date();
    document.querySelectorAll(".next-card").forEach(function(card){
      var boss = bosses.find(function(b){ return b.id === card.dataset.id; });
      if (!boss) return;
      var w = windowFor(boss);
      if (!w) return;
      var isUp = now >= w.start;
      var statusEl = card.querySelector(".live-status");
      var cdEl = card.querySelector(".live-countdown");
      statusEl.className = "status live-status " + (isUp ? "up" : "wait");
      statusEl.textContent = isUp ? "Puede salir" : "En espera";
      cdEl.innerHTML = isUp
        ? '<span class="num">' + fmtDuration(now - w.start) + '</span> en ventana'
        : '<span class="num">' + fmtDuration(w.start - now) + '</span>';
      card.classList.toggle("is-up", isUp);
    });
    document.querySelectorAll(".window-line[data-id]").forEach(function(el){
      var boss = bosses.find(function(b){ return b.id === el.dataset.id; });
      if (!boss) return;
      var w = windowFor(boss);
      el.innerHTML = windowHtmlFor(w, now);
      var row = el.closest(".boss-row");
      if (row) row.classList.toggle("is-up", !!w && now >= w.start);
    });
  }

  function wireRowEvents(){
    bossList.querySelectorAll(".died-now").forEach(function(btn){
      btn.addEventListener("click", function(){
        recordDeath(btn.dataset.id, new Date());
      });
    });
    bossList.querySelectorAll(".setdeath-toggle").forEach(function(btn){
      btn.addEventListener("click", function(){
        openTimeInputs.add(btn.dataset.id);
        render();
      });
    });
    bossList.querySelectorAll(".setdeath-cancel").forEach(function(btn){
      btn.addEventListener("click", function(){
        openTimeInputs.delete(btn.dataset.id);
        render();
      });
    });
    bossList.querySelectorAll(".setdeath-confirm").forEach(function(btn){
      btn.addEventListener("click", function(){
        var input = bossList.querySelector('.deathpicker[data-id="' + btn.dataset.id + '"]');
        if (!input.value) return;
        var parts = input.value.split(":"); // "HH:MM"
        var d = new Date();
        d.setHours(Number(parts[0]), Number(parts[1]), 0, 0);
        if (d.getTime() > Date.now()) d.setDate(d.getDate() - 1); // hora futura => fue ayer
        openTimeInputs.delete(btn.dataset.id);
        recordDeath(btn.dataset.id, d);
      });
    });
    bossList.querySelectorAll(".undo-death").forEach(function(btn){
      btn.addEventListener("click", function(){
        clearDeath(btn.dataset.id);
      });
    });
    bossList.querySelectorAll(".del-corner").forEach(function(btn){
      btn.addEventListener("click", function(){
        if (!confirm("¿Eliminar este boss de la lista? Se borra por completo, no solo su muerte.")) return;
        apiCall({ action: "delete", id: btn.dataset.id });
      });
    });
    bossList.querySelectorAll(".bname").forEach(function(input){
      input.addEventListener("change", function(){
        var v = input.value.trim();
        if (!v) return;
        apiCall({ action: "update", id: input.dataset.id, name: v });
      });
    });
    bossList.querySelectorAll(".notes").forEach(function(input){
      input.addEventListener("change", function(){
        apiCall({ action: "update", id: input.dataset.id, notes: input.value.trim() });
      });
    });
    bossList.querySelectorAll(".hrs").forEach(function(input){
      input.addEventListener("change", function(){
        var v = parseFloat(input.value);
        if (isNaN(v) || v < 0) return;
        var payload = { action: "update", id: input.dataset.id };
        payload[input.dataset.field] = v;
        apiCall(payload);
      });
    });
  }

  function recordDeath(id, date){
    apiCall({ action: "update", id: id, lastDeathAt: date.toISOString(), lastBy: getNick() });
  }

  function clearDeath(id){
    apiCall({ action: "update", id: id, lastDeathAt: null, lastBy: null });
  }

  // Delegado: los botones ✕ de las cards de "Próximos 3" se recrean en
  // cada render(), así que se escuchan una sola vez en el contenedor padre.
  nextGrid.addEventListener("click", function(e){
    var btn = e.target.closest(".undo-death-card");
    if (btn) clearDeath(btn.dataset.id);
  });

  document.getElementById("addBtn").addEventListener("click", function(){
    var nameEl = document.getElementById("newName");
    var name = nameEl.value.trim();
    if (!name) { nameEl.focus(); return; }
    var minH = parseFloat(document.getElementById("newMin").value) || 6;
    var maxH = parseFloat(document.getElementById("newMax").value) || 7;
    apiCall({ action: "add", name: name, minHours: minH, maxHours: maxH }).then(function(){
      nameEl.value = "";
    });
  });

  function handleResponse(promise){
    return promise
      .then(function(r){ return r.json(); })
      .then(function(data){
        if (data && data.ok && data.bosses) {
          bosses = data.bosses;
          render();
          dbStatusEl.textContent = "Conectado — se actualiza solo cada " + (POLL_MS/1000) + "s.";
        } else {
          dbStatusEl.textContent = "El servidor devolvió un error" + (data && data.error ? " (" + data.error + ")" : "") + ". Reintentá.";
        }
      })
      .catch(function(){
        dbStatusEl.textContent = "No se pudo conectar con Google Sheets. Revisá la URL configurada.";
      });
  }

  function apiCall(payload){
    if (!API_URL) { dbStatusEl.textContent = "Falta configurar la URL de Google Apps Script arriba."; return Promise.resolve(); }
    return handleResponse(fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // evita preflight CORS
      body: JSON.stringify(payload)
    }));
  }

  function fetchAll(){
    if (!API_URL) return;
    handleResponse(fetch(API_URL));
  }

  setInterval(tick, 1000);
  if (API_URL) {
    fetchAll();
    setInterval(fetchAll, POLL_MS);
  } else {
    render();
  }
})();
</script>
</body>
</html>
